<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="imagetoolbar" content="no" />
        <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

        <link rel="icon" href="../img/common/favicon.png" type="image/png" sizes="16x16" />
        <link rel="stylesheet" type="text/css" href="../css/style.css" />
        <link rel="stylesheet" href="../css/site.css" />
        <link rel="stylesheet" type="text/css" href="../css/contact.css" />
        <script src="../js/common.js" defer></script>
        <script src="../js/contact.js" defer></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
        
        <!-- EmailJS  -->
        <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
        
        <title>Contact | (주)유니크닷</title>
        <meta name="description" content="울산 UNIST 내 위치한 (주)유니크닷에 제품·샘플·맞춤형 개발을 문의하세요. 전화 052-217-3549." />
        <link rel="canonical" href="https://www.uniqdot.co.kr/page/contact.html" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Contact | (주)유니크닷" />
        <meta property="og:description" content="울산 UNIST 내 위치한 (주)유니크닷에 제품·샘플·맞춤형 개발을 문의하세요. 전화 052-217-3549." />
        <meta property="og:image" content="https://www.uniqdot.co.kr/img/index/nature-1.jpg" />
            <link rel="stylesheet" href="../css/pages.css" />
        <script src="../js/qd-bg.js" defer></script>
    </head>
    <body>
        <div id="header"></div>

        <div class="sub0101 sub" style="margin-bottom: 0">
            <section class="pg-hero"><div class="wrap"><p class="eyebrow">CONTACT</p><h1 data-i18n="contact.title"></h1></div></section>
            <div class="width">
                <div class="contact_content">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d811.2708214592587!2d129.1887088292425!3d35.576336089539375!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzXCsDM0JzM0LjgiTiAxMjnCsDExJzIxLjMiRQ!5e0!3m2!1sko!2skr!4v1580180897137!5m2!1sko!2skr"
                        width="100%"
                        height="400"
                                                style="border: 0"
                        allowfullscreen="" title="UniQDot 위치 지도" loading="lazy"
                    ></iframe>
                    <div class="map_attachment">
                        <div class="contact">
                            <img src="../img/common/logo.png" alt="UniQDot" loading="lazy" />
                            <div class="contact-info">
                                <p>
                                    <b data-i18n="contact.address.label"></b>
                                    <span data-i18n="contact.address.value"></span>
                                </p>
                                <p>
                                    <b data-i18n="contact.tel.label"></b>
                                    <span data-i18n="contact.tel.value"></span>
                                </p>
                                <p>
                                    <b data-i18n="contact.email.label"></b>
                                    <span data-i18n="contact.email.value"></span>
                                </p>
                            </div>
                            <div id="contact-form-box">
                                <form id="contact-form" method="post">
                                    <label>
                                        <b>Name</b> <span class="required">*</span>
                                    </label>
                                    <input type="text" id="name" name="name" autocomplete="name" required>
                                    <label>
                                        <b>Email</b> <span class="required">*</span>
                                    </label>
                                    <input type="email" id="email" name="email" autocomplete="email" required>
                                    <label>
                                        <b>Message</b> <span class="required">*</span>
                                    </label>
                                    <textarea id="message" name="message" required></textarea>
                                    <p style="font-size:13px;color:#5d6678;margin:0 0 10px"><a href="privacy.html" target="_blank" rel="noopener" data-i18n="footer.privacy">개인정보처리방침</a></p>
                                    <button type="submit" data-i18n="contact.button"></button>
                                    <p id="form-status" role="status" aria-live="polite"></p>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="footer"></div>
    </body>
</html>
